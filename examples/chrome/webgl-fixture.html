<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>bionicx-webgl-fixture</title></head>
<body style="margin:0;background:#102040;color:#fff;font:20px sans-serif">
<canvas id="c" width="640" height="360" style="display:block"></canvas>
<pre id="out">starting</pre>
<script>
const canvas = document.getElementById("c");
const out = document.getElementById("out");
const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
if (!gl) {
  out.textContent = "WEBGL_FAIL";
  document.title = "WEBGL_FAIL";
} else {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.1, 0.75, 0.25, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  const vendor = dbg
    ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)
    : gl.getParameter(gl.VENDOR);
  const renderer = dbg
    ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
    : gl.getParameter(gl.RENDERER);
  const text = String(vendor) + " " + String(renderer);
  const vulkan = /ANGLE/i.test(text) && /Vulkan/i.test(text);
  const swift = /SwiftShader/i.test(text);
  if (vulkan && !swift) {
    out.textContent = "WEBGL_OK vendor=" + vendor + " renderer=" + renderer;
    document.title = "WEBGL_OK";
  } else {
    out.textContent = "WEBGL_NOT_VULKAN vendor=" + vendor + " renderer=" + renderer;
    document.title = "WEBGL_NOT_VULKAN";
  }
}
</script>
</body>
</html>
