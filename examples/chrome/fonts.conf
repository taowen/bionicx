<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/data/data/io.taowen.bx/files/apps/chrome/usr/share/fonts</dir>
  <cachedir>/data/data/io.taowen.bx/files/homes/chrome/.cache/fontconfig-bionicx-v1</cachedir>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Roboto Mono</family><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer>
  </alias>

  <config>
    <rescan><int>30</int></rescan>
  </config>
</fontconfig>
