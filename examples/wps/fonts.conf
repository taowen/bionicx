<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/data/data/io.taowen.bx/files/rootfs/usr/share/fonts</dir>
  <dir>/data/data/io.taowen.bx/files/apps/wps-office/usr/share/fonts</dir>
  <dir>/data/data/io.taowen.bx/files/apps/wps-office/opt/kingsoft/wps-office/office6/mui/default/linux_fonts</dir>
  <dir>/data/data/io.taowen.bx/files/apps/wps-office/opt/kingsoft/wps-office/office6/document theme/theme fonts</dir>
  <cachedir>/data/data/io.taowen.bx/files/homes/wps-office/.cache/fontconfig-bionicx-v1</cachedir>

  <alias binding="strong">
    <family>Calibri</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Cambria</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <config>
    <rescan><int>30</int></rescan>
  </config>
</fontconfig>
